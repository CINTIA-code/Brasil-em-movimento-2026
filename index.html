
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#85000D">
  <title>Lula 13 | Meu filtro</title>

  <style>
    :root {
      --red: #C90018;
      --dark-red: #85000D;
      --yellow: #FFD83D;
      --white: #FFFFFF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background: var(--dark-red);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 30px;
      font-weight: 900;
    }

    h1 span {
      color: var(--yellow);
    }

    .subtitle {
      margin: 0 0 22px;
      color: #ffe7e7;
      font-size: 14px;
    }

    .stage {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #250006;
      border: 5px solid #FF2538;
      border-radius: 20px;
      box-shadow: 0 8px 28px #39000780;
    }

    video,
    #photo {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    video {
      transform: scaleX(-1);
    }

    #photo {
      display: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 14px;
      pointer-events: none;
    }

    .campaign-label {
      align-self: center;
      padding: 11px 18px;
      background: var(--red);
      color: var(--white);
      border: 2px solid var(--yellow);
      border-radius: 8px;
      font-size: 24px;
      font-weight: 900;
      text-shadow: 1px 2px #67000b;
    }

    .campaign-bottom {
      margin: 0 -14px -18px;
      padding: 16px 10px 20px;
      background: linear-gradient(
        transparent,
        #5c0000e8 30%,
        #5c0000f5
      );
    }

    .slogan {
      width: 100%;
      padding: 10px;
      color: var(--yellow);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.2;
      overflow-wrap: anywhere;
      text-shadow: 1px 2px #350000;
    }

    .signature {
      margin-top: 4px;
      color: white;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      padding: 14px 10px;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--yellow);
      color: #510000;
    }

    .secondary {
      background: white;
      color: var(--dark-red);
    }

    .wide {
      grid-column: 1 / -1;
    }

    input {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 2px solid var(--yellow);
      border-radius: 10px;
      font-size: 16px;
    }

    #status {
      min-height: 36px;
      margin-top: 12px;
      color: #ffe8a0;
      font-size: 13px;
      line-height: 1.5;
    }

    .note {
      margin-top: 20px;
      color: #ffdada;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>LULA <span>13</span></h1>
    <p class="subtitle">Sua voz, sua escolha, sua foto.</p>

    <div class="stage" id="stage">
      <video id="camera" autoplay playsinline muted></video>
      <img id="photo" alt="Foto com moldura da campanha">

      <div class="overlay">
        <div class="campaign-label">★ LULA • 13 ★</div>

        <div class="campaign-bottom">
          <div class="slogan" id="previewSlogan">
            Lula 13 • Esperança de novo
          </div>
          <div class="signature">BRASIL • DEMOCRACIA</div>
        </div>
      </div>
    </div>

    <input
      id="phrase"
      type="text"
      maxlength="70"
      value="Lula 13 • Esperança de novo"
      placeholder="Escreva sua frase"
      aria-label="Personalizar frase"
    >

    <div class="controls">
      <button class="primary" id="start">
        📷 Abrir câmera
      </button>

      <button class="secondary" id="capture">
        ✨ Tirar foto
      </button>

      <button class="secondary" id="retake">
        🔄 Nova foto
      </button>

      <button class="primary" id="download">
        ⬇ Baixar foto
      </button>

      <button class="primary wide" id="share">
        ↗ Compartilhar imagem
      </button>
    </div>

    <p id="status" role="status" aria-live="polite">
      Clique em “Abrir câmera” para começar.
    </p>

    <p class="note">
      Experiência independente de apoio político.
      A câmera só é acessada após sua autorização.
    </p>
  </main>

  <canvas id="canvas" hidden></canvas>

  <script>
    const camera = document.getElementById("camera");
    const photo = document.getElementById("photo");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const phrase = document.getElementById("phrase");
    const previewSlogan = document.getElementById("previewSlogan");
    const status = document.getElementById("status");

    let stream = null;
    let photoReady = false;

    phrase.addEventListener("input", () => {
      previewSlogan.textContent =
        phrase.value.trim() || "Lula 13";
    });

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "A câmera exige HTTPS ou um ambiente local compatível."
          );
        }

        stopCamera();

        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: "user",
            width: { ideal: 1080 },
            height: { ideal: 1440 }
          }
        });

        camera.srcObject = stream;
        await camera.play();

        camera.style.display = "block";
        photo.style.display = "none";
        photoReady = false;

        status.textContent =
          "Câmera aberta! Posicione-se e tire sua foto.";
      } catch (error) {
        status.textContent =
          "Não foi possível abrir a câmera. Autorize o acesso " +
          "nas configurações do navegador e tente novamente. " +
          error.message;
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      camera.srcObject = null;
    }

    function drawCampaignFrame() {
      const w = canvas.width;
      const h = canvas.height;

      // Moldura vermelha
      ctx.strokeStyle = "#FF2538";
      ctx.lineWidth = Math.max(12, w * 0.012);
      ctx.strokeRect(
        ctx.lineWidth / 2,
        ctx.lineWidth / 2,
        w - ctx.lineWidth,
        h - ctx.lineWidth
      );

      // Faixa superior
      const topHeight = h * 0.13;

      ctx.fillStyle = "#C90018";
      ctx.fillRect(0, 0, w, topHeight);

      ctx.strokeStyle = "#FFD83D";
      ctx.lineWidth = Math.max(4, w * 0.004);
      ctx.strokeRect(
        w * 0.05,
        h * 0.025,
        w * 0.90,
        topHeight * 0.72
      );

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#FFFFFF";
      ctx.font = `900 ${Math.round(w * 0.075)}px Arial`;

      ctx.fillText("★ LULA • 13 ★", w / 2, topHeight * 0.40);

      // Degradê inferior
      const bottomHeight = h * 0.25;
      const gradient = ctx.createLinearGradient(
        0,
        h - bottomHeight,
        0,
        h
      );

      gradient.addColorStop(0, "rgba(92,0,0,0)");
      gradient.addColorStop(0.30, "rgba(92,0,0,0.91)");
      gradient.addColorStop(1, "rgba(92,0,0,0.98)");

      ctx.fillStyle = gradient;
      ctx.fillRect(0, h - bottomHeight, w, bottomHeight);

      // Frase personalizável
      const slogan = phrase.value.trim() || "Lula 13";
      const maxWidth = w * 0.88;
      const fontSize = Math.round(w * 0.065);

      ctx.font = `900 ${fontSize}px Arial`;
      ctx.fillStyle = "#FFD83D";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const words = slogan.split(/\s+/);
      const lines = [];
      let line = "";

      for (const word of words) {
        const test = line ? line + " " + word : word;

        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }

      if (line) lines.push(line);

      const lineHeight = fontSize * 1.15;
      const availableHeight = bottomHeight * 0.58;
      const fittedSize = Math.min(
        fontSize,
        availableHeight / Math.max(lines.length, 1) / 1.15
      );

      ctx.font = `900 ${Math.round(fittedSize)}px Arial`;

      const actualLineHeight = fittedSize * 1.15;
      const startY =
        h - bottomHeight * 0.67 -
        ((lines.length - 1) * actualLineHeight) / 2;

      lines.forEach((text, i) => {
        ctx.fillText(
          text,
          w / 2,
          startY + i * actualLineHeight,
          maxWidth
        );
      });

      // Assinatura inferior
      ctx.fillStyle = "#FFFFFF";
      ctx.font = `bold ${Math.round(w * 0.032)}px Arial`;
      ctx.fillText(
        "BRASIL • DEMOCRACIA",
        w / 2,
        h - bottomHeight * 0.13
      );
    }

    function capturePhoto() {
      if (!stream || !camera.videoWidth) {
        status.textContent =
          "Abra a câmera e aguarde a imagem aparecer.";
        return;
      }

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;

      // Espelha a imagem para corresponder à prévia da câmera frontal
      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(
        camera,
        0,
        0,
        canvas.width,
        canvas.height
      );
      ctx.restore();

      drawCampaignFrame();

      photo.src = canvas.toDataURL("image/png");
      photo.style.display = "block";
      camera.style.display = "none";
      photoReady = true;

      stopCamera();

      status.textContent =
        "Foto pronta! Você pode baixar ou compartilhar.";
    }

    function retakePhoto() {
      photoReady = false;
      startCamera();
    }

    function downloadPhoto() {
      if (!photoReady) {
        status.textContent = "Tire uma foto primeiro.";
        return;
      }

      const link = document.createElement("a");
      link.download = "lula-13-minha-foto.png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    async function sharePhoto() {
      if (!photoReady) {
        status.textContent = "Tire uma foto primeiro.";
        return;
      }

      canvas.toBlob(async blob => {
        if (!blob) {
          status.textContent = "Não foi possível preparar a imagem.";
          return;
        }

        const file = new File(
          [blob],
          "lula-13-minha-foto.png",
          { type: "image/png" }
        );

        try {
          if (
            navigator.canShare &&
            navigator.canShare({ files: [file] }) &&
            navigator.share
          ) {
            await navigator.share({
              title: "Minha foto — Lula 13",
              text: "Minha foto personalizada.",
              files: [file]
            });
          } else {
            downloadPhoto();
            status.textContent =
              "Imagem baixada. Agora você pode anexá-la " +
              "ao Instagram ou compartilhá-la.";
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            status.textContent =
              "Não foi possível compartilhar. Tente baixar a foto.";
          }
        }
      }, "image/png");
    }

    document.getElementById("start")
      .addEventListener("click", startCamera);

    document.getElementById("capture")
      .addEventListener("click", capturePhoto);

    document.getElementById("retake")
      .addEventListener("click", retakePhoto);

    document.getElementById("download")
      .addEventListener("click", downloadPhoto);

    document.getElementById("share")
      .addEventListener("click", sharePhoto);

    window.addEventListener("pagehide", stopCamera);
  </script>
</body>
</html>
